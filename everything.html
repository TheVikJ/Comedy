<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>everything — vikramaditya jaisingh</title>
    <link rel="stylesheet" href="/css/base.css" />
    <style>
      body {
        background: #191b1a;
      }

      .nav a {
        color: #999 !important;
      }

      .comic-header {
        text-align: center;
        padding: 20px 0 24px;
      }

      .comic-header h1 {
        color: #ffffff;
        margin: 0 0 4px;
      }

      .comic-header p {
        color: #666;
        margin: 0 0 16px;
        font-size: 14px;
      }

      .pdf-btn {
        display: inline-block;
        color: #999;
        border: 1px solid #444;
        padding: 6px 18px;
        text-decoration: none;
        font-size: 13px;
        letter-spacing: 1px;
        transition: border-color 0.2s, color 0.2s;
      }

      .pdf-btn:hover {
        color: #ffffff;
        border-color: #ffffff;
      }

      .comic-pages {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        padding-bottom: 40px;
      }

      .comic-pages img {
        width: min(700px, 100%);
        height: auto;
        display: block;
      }

      footer {
        color: #666;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="nav">
        <a href="/sockson.html">← work</a>
        <a href="/index.html">home</a>
      </div>

      <div class="comic-header">
        <h1>everything</h1>
        <p>a comic — may 2024</p>
        <a class="pdf-btn" href="/images/everything/everything.pdf" target="_blank">view as PDF</a>
      </div>

      <div class="comic-pages">
        <img src="/images/everything/Everything_1.jpg" alt="everything — page 1" />
        <img src="/images/everything/Everything_2.jpg" alt="everything — page 2" />
        <img src="/images/everything/Everything_3.jpg" alt="everything — page 3" />
        <img src="/images/everything/Everything_4.jpg" alt="everything — page 4" />
        <img src="/images/everything/Everything_5.jpg" alt="everything — page 5" />
      </div>

      <footer style="margin-top: 0;">© vikramaditya jaisingh</footer>
    </div>
  </body>
</html>
